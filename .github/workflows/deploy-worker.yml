# Matches local `npm run deploy`: build → stamp → Pages → standalone Worker.
# Deploy scripts: scripts/deploy-ci.mjs, deploy-pages.mjs, deploy-worker.mjs
# (Worker uses dist/wrangler.worker.json — not dist/_worker.js/wrangler.json)
name: Deploy to Cloudflare

on:
  push:
    branches: [dev, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run generate:workbook-downloads
      - run: bun run build
      - name: Deploy to Cloudflare Pages and Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy:ci
