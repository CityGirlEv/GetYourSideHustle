    <script>
      (function () {
        var KEY = "gysh_stale_chunk_reload";
        var BANNER_ID = "gysh-stale-shell-refresh";
        function assetKey(u) {
          var m = String(u || "").match(/\/assets\/([^/?#]+\.(?:js|css))/i);
          return m ? m[1].toLowerCase() : String(u || "1").slice(0, 180) || "1";
        }
        function showBanner() {
          if (document.getElementById(BANNER_ID)) return;
          var el = document.createElement("div");
          el.id = BANNER_ID;
          el.className = "gysh-stale-shell-refresh";
          el.setAttribute("data-testid", "stale-shell-refresh");
          el.innerHTML =
            '<div class="gysh-stale-shell-refresh__inner" role="alert">' +
            "<p><strong>Update available.</strong> This page is out of date — tap Refresh to load the latest version.</p>" +
            '<button type="button" class="gysh-stale-shell-refresh__btn" data-gysh-stale-refresh>Refresh</button>' +
            "</div>";
          el.addEventListener("click", function (ev) {
            var t = ev.target;
            if (t && t.closest && t.closest("[data-gysh-stale-refresh]")) {
              try {
                sessionStorage.removeItem(KEY);
              } catch (x) {}
              location.reload();
            }
          });
          (document.body || document.documentElement).insertBefore(
            el,
            (document.body || document.documentElement).firstChild,
          );
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (!t) return;
            var u = t.src || t.href || "";
            if (!/\/assets\/[^/?#]+\.(js|css)$/i.test(u)) return;
            var k = assetKey(u);
            try {
              if (sessionStorage.getItem(KEY) === k) {
                showBanner();
                return;
              }
              sessionStorage.setItem(KEY, k);
              location.reload();
            } catch (x) {}
          },
          true,
        );
      })();
    </script>
